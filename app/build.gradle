plugins {
    id 'com.android.application' version '8.7.3'
}

def signingPropertiesFile = rootProject.file('keystore.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'com.tizianoluziramos.lsposed.gmailaccountsort'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tizianoluziramos.lsposed.gmailaccountsort'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.isFile()) {
                storeFile = rootProject.file(signingProperties.getProperty('storeFile'))
                storeType = 'PKCS12'
                storePassword = signingProperties.getProperty('storePassword')
                keyAlias = signingProperties.getProperty('keyAlias')
                keyPassword = signingProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
